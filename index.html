<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cockpit">
<meta name="theme-color" content="#F8F5F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151217" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Cockpit</title>
<style>
:root{
  --bg:#F8F5F4;--card:#FFFFFF;--ink:#2E2530;--muted:#8E8290;--track:#F0EAEC;
  --accent:#B0707F;--sage:#6F9180;--gold:#AE8C55;--gold-soft:#F6EFE4;--water:#6690AE;--danger:#C0545E;
  --shadow:rgba(46,37,48,.06);--line:rgba(46,37,48,.09);
  --serif:ui-serif,"New York","Iowan Old Style",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Helvetica Neue",sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#151217;--card:#211D24;--ink:#F1EAF0;--muted:#9F94A2;--track:#352F38;
  --accent:#D497A6;--sage:#94B6A4;--gold:#D5B67E;--gold-soft:#2A2420;--water:#8DB3CE;--danger:#E27B84;
  --shadow:rgba(0,0,0,.35);--line:rgba(255,255,255,.09);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;font:16px/1.4 var(--sans);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body.noscroll{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit;transition:transform .18s var(--ease),opacity .18s}
button:active{transform:scale(.97)}
button:disabled{cursor:default}
input,textarea{font:inherit;font-size:17px;color:var(--ink);-webkit-user-select:text;user-select:text}
.ico{flex:none;display:inline-block;vertical-align:middle}
#view{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 104px)}
.head{padding:6px 4px 16px}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.12em;color:var(--muted)}
.title{font-family:var(--serif);font-weight:600;font-size:34px;line-height:1.1;margin:4px 0 0;letter-spacing:-.01em}
.sub-gold{color:var(--gold);font-weight:600;font-size:15px;margin-top:6px}
.card{background:var(--card);border-radius:24px;padding:18px;margin-bottom:14px;box-shadow:0 1px 2px var(--shadow),0 8px 28px var(--shadow)}
.card.flat{padding:2px 16px}
.label{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;align-items:center}
.row.base{align-items:baseline;gap:6px;flex-wrap:wrap}
.between{justify-content:space-between}
.gap{gap:10px}
.spacer{flex:1}
.stack{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.muted{color:var(--muted)}
.big{font-family:var(--serif);font-weight:600;font-size:42px;line-height:1.05;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.mid{font-family:var(--serif);font-size:24px;font-weight:600}
.note{font-size:14px;color:var(--muted);margin:12px 0 0;line-height:1.45}
.center{text-align:center}
.pct{font-weight:600;font-size:15px}
.bar{background:var(--track);border-radius:99px;overflow:hidden;width:100%;margin-top:10px}
.bar-fill{height:100%;border-radius:99px;width:0;transition:width .9s var(--ease)}
.steps{display:block;width:100%;margin-top:14px}
.tiles{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px;margin-top:14px}
.tile{background:color-mix(in srgb,var(--track) 65%,transparent);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:5px;min-width:0}
.tile .v{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .t{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .ico{color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);padding:6px 11px;border-radius:99px;white-space:nowrap}
.pill{flex:none}
.pill.soft{color:var(--muted);background:var(--track)}
.btn-primary{display:block;width:100%;text-align:center;background:var(--c,var(--accent));color:#fff;border-radius:99px;padding:15px;font-size:15px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;box-shadow:0 6px 18px color-mix(in srgb,var(--c,var(--accent)) 30%,transparent)}
.btn-soft{flex:1;display:block;text-align:center;color:var(--c,var(--accent));background:color-mix(in srgb,var(--c,var(--accent)) 13%,transparent);border-radius:99px;padding:13px 10px;font-size:15px;font-weight:600}
.btn-danger{display:block;width:100%;text-align:center;color:var(--danger);background:color-mix(in srgb,var(--danger) 10%,transparent);border-radius:14px;padding:13px;font-weight:600;margin-top:6px}
.quiet{color:var(--muted);font-size:14px;text-align:center;width:100%;padding:4px}
.linkish{color:var(--muted);font-size:13px;display:inline-flex;align-items:center;gap:5px;align-self:flex-start}
.kicker{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.timer{font-size:50px}
.mono{font-variant-numeric:tabular-nums}
/* Hero mariage */
.hero{background:linear-gradient(150deg,var(--gold-soft),var(--card) 78%);border:1px solid color-mix(in srgb,var(--gold) 30%,transparent);border-radius:28px;padding:22px;box-shadow:0 10px 32px color-mix(in srgb,var(--gold) 16%,transparent)}
.hero-top{display:flex;justify-content:space-between;color:var(--gold);font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.hero-big{font-family:var(--serif);font-weight:600;font-size:66px;line-height:1;margin-top:16px;letter-spacing:-.02em}
.hero-sub{font-family:var(--serif);font-style:italic;font-size:20px;color:var(--muted);margin-top:4px}
.hero-foot{font-size:14px;color:var(--muted);margin-top:16px}
.tl{margin-top:22px;padding:0 7px}
.tl-track{position:relative;height:3px;background:color-mix(in srgb,var(--gold) 22%,transparent);border-radius:99px}
.tl-fill{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,color-mix(in srgb,var(--gold) 50%,transparent),var(--gold));transition:width 1.2s var(--ease)}
.tl-fill::after{content:"";position:absolute;right:-7px;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 4px color-mix(in srgb,var(--gold) 20%,transparent),0 2px 8px color-mix(in srgb,var(--gold) 50%,transparent)}
.tl-mark{position:absolute;top:50%;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;background:var(--card);border:1.5px solid var(--gold)}
.tl-mark.on{background:var(--gold)}
.tl-heart{position:absolute;right:-9px;top:50%;transform:translateY(-50%);color:var(--gold);display:flex}
.tl-legend{display:flex;justify-content:space-between;margin:12px -7px 0;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
/* Échelles */
.scale{display:flex;align-items:center;justify-content:space-between;padding:7px 0;gap:8px}
.scale-t{display:flex;align-items:center;gap:8px;font-size:15px;min-width:0}
.scale-t .ico{color:var(--c)}
.dots{display:flex;gap:7px;flex:none}
.dot{width:31px;height:31px;border-radius:50%;background:var(--track);color:var(--muted);font-size:12px;font-weight:600;display:grid;place-items:center;text-align:center;transition:background .25s,color .25s,transform .2s var(--ease)}
.dot.on{background:var(--c);color:#fff}
/* Ma journée */
.plan-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sec{margin-top:18px}
.arow{display:flex;align-items:center;gap:12px;width:100%;padding:9px 0;font-size:16px}
.arow .ck{color:color-mix(in srgb,var(--muted) 55%,transparent);display:flex}
.arow.done .ck{color:var(--sage)}
.arow.done .at{color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--muted) 60%,transparent)}
.arow .auto{margin-left:auto;color:var(--muted);opacity:.7;display:flex}
.arow .edit{margin-left:auto;color:var(--accent);display:flex}
.empty{font-size:14px;color:var(--muted);opacity:.8;margin:8px 0 0}
.icon-btn{color:var(--accent);display:flex;padding:4px}
.pop{animation:pop .45s var(--ease)}
@keyframes pop{0%{transform:scale(.82)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.ring circle{transition:stroke-dashoffset 1s var(--ease)}
/* Repas */
.meals{display:flex;flex-direction:column;margin-top:4px}
.meal{display:flex;gap:12px;align-items:center;width:100%;padding:9px 0;border-top:.5px solid var(--line)}
.meal:first-child{border-top:0}
.meal img,.meal-ico{width:52px;height:52px;border-radius:13px;object-fit:cover;flex:none;background:var(--track);display:grid;place-items:center;color:var(--muted)}
.meal-txt{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1;font-size:15px}
.meal-txt span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meal-time{font-size:12px;font-weight:600;color:var(--muted)}
.meal-meta{font-size:12px;color:var(--muted)}
.meal>.ico{color:var(--muted)}
.frow{display:flex;align-items:center;gap:8px;width:100%;padding:10px 0;font-size:15px;border-top:.5px solid var(--line)}
.frow:first-of-type{border-top:0}
/* Calendrier */
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}
.cell{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 8px;border-radius:14px;background:var(--gold-soft);border:1.5px solid transparent;text-align:center}
.cell.future{background:color-mix(in srgb,var(--track) 55%,transparent)}
.cell.future .n{color:color-mix(in srgb,var(--muted) 60%,transparent)}
.cell.today{border-color:var(--accent)}
.cell .j{font-size:9px;font-weight:700;letter-spacing:.08em;color:var(--muted)}
.cell .n{font-family:var(--serif);font-size:21px;font-weight:600;height:26px;display:flex;align-items:center}
.cell .p{width:5px;height:5px;border-radius:50%}
.cell .p.on{background:var(--accent)}
.cell.wed .j,.cell.wed .n{color:var(--gold)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.stat{background:color-mix(in srgb,var(--track) 65%,transparent);border-radius:16px;padding:12px}
.stat .v{font-family:var(--serif);font-size:22px;font-weight:600}
.stat .t{font-size:12px;color:var(--muted);margin-top:2px}
.back{display:inline-flex;align-items:center;gap:2px;color:var(--accent);font-size:17px;padding:4px 0 6px;margin-left:-4px}
.install{border:1px solid color-mix(in srgb,var(--gold) 35%,transparent)}
/* Réglages */
.group-title{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:18px 8px 8px}
.srow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 0;border-bottom:.5px solid var(--line);min-height:52px}
.srow:last-child{border-bottom:0}
.srow .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.srow input[type=date]{border:0;background:transparent;color:var(--accent);font-weight:600;text-align:right;-webkit-appearance:none;appearance:none;min-width:0}
.stepper{display:flex;align-items:center;gap:8px}
.stepper b{min-width:70px;text-align:center;font-variant-numeric:tabular-nums}
.stepper button,.mini{width:34px;height:34px;border-radius:50%;background:var(--track);display:grid;place-items:center;color:var(--accent);font-size:19px;font-weight:600;text-align:center}
.sec-title{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:14px 0 2px;display:flex;align-items:center;gap:6px}
.btn-col{display:flex;flex-direction:column;gap:10px;padding:14px 0}
.sw{-webkit-appearance:none;appearance:none;width:51px;height:31px;border-radius:99px;background:var(--track);position:relative;transition:background .25s;flex:none;margin:0}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .25s var(--ease)}
.sw:checked{background:var(--sage)}
.sw:checked::after{transform:translateX(20px)}
/* Barre d'onglets */
#tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;padding:8px 12px calc(env(safe-area-inset-bottom) + 6px);background:color-mix(in srgb,var(--bg) 80%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(20px);backdrop-filter:saturate(1.6) blur(20px);border-top:.5px solid var(--line);z-index:20}
#tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);padding:4px 0}
#tabbar button.on{color:var(--accent)}
/* Feuilles */
#sheet-root{position:fixed;inset:0;z-index:50;pointer-events:none}
#sheet-root.open{pointer-events:auto}
.scrim{position:absolute;inset:0;background:rgba(20,14,22,.38);opacity:0;transition:opacity .3s}
#sheet-root.open .scrim{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92vh;display:flex;flex-direction:column;background:var(--bg);border-radius:26px 26px 0 0;transform:translateY(100%);transition:transform .38s var(--ease);padding-bottom:env(safe-area-inset-bottom);max-width:560px;margin:0 auto;box-shadow:0 -10px 40px rgba(0,0,0,.12)}
#sheet-root.open .sheet{transform:none}
.grabber{width:38px;height:5px;border-radius:9px;background:var(--track);margin:8px auto 0}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 8px;gap:8px}
.sh-title{font-weight:600;font-size:17px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.sh-btn{color:var(--accent);font-size:16px;min-width:84px}
.sh-btn.strong{font-weight:700;text-align:right}
.sheet-body{overflow:auto;padding:8px 16px 28px;-webkit-overflow-scrolling:touch}
.group{background:var(--card);border-radius:18px;padding:2px 14px;margin-bottom:14px}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:.5px solid var(--line);min-height:50px}
.field:last-child{border-bottom:0}
.field input,.field textarea{border:0;background:transparent;text-align:right;outline:none;min-width:0;flex:1;padding:0}
.field input[type=datetime-local]{-webkit-appearance:none;appearance:none;color:var(--accent);font-weight:600;text-align:right}
.field.col{flex-direction:column;align-items:stretch}
.field.col input,.field.col textarea{text-align:left}
textarea{resize:none;min-height:72px}
.hint{font-size:13px;color:var(--muted);margin:0 6px 14px;line-height:1.45}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.chip{padding:8px 13px;border-radius:99px;background:var(--card);font-size:14px;font-weight:600;box-shadow:0 1px 3px var(--shadow)}
.chip.on{background:var(--accent);color:#fff}
.seg{display:flex;background:var(--track);border-radius:12px;padding:3px;margin:0 0 14px}
.seg button{flex:1;text-align:center;padding:9px;border-radius:9px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px var(--shadow)}
.bigin{font-family:var(--serif);font-size:44px;font-weight:600;text-align:center;width:100%;border:0;background:transparent;outline:none;padding:12px 0;font-variant-numeric:tabular-nums}
.photo-pick{display:flex;align-items:center;gap:8px;color:var(--accent);font-weight:600;padding:13px 0}
.photo-prev img{width:100%;max-height:220px;object-fit:cover;border-radius:14px;margin:2px 0 12px;display:block}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 92px);transform:translate(-50%,16px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:14px;font-weight:600;opacity:0;transition:.3s var(--ease);z-index:60;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
.unit{color:var(--muted);font-size:15px;flex:none}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:14px}
.cmps{margin-top:10px}
.cmp{display:grid;grid-template-columns:5.5em 1fr auto;align-items:baseline;gap:8px;padding:9px 0;border-top:.5px solid var(--line);font-size:15px}
.cmp:first-child{border-top:0}
.cmp-l{color:var(--muted)}
.cmp-v{font-variant-numeric:tabular-nums}
.cmp-d{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
#update-banner{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 10px);z-index:45;max-width:536px;margin:0 auto;display:none;animation:pop .45s var(--ease)}
#update-banner.show{display:block}
.ub{display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--bg);border-radius:18px;padding:12px 12px 12px 16px;box-shadow:0 10px 30px rgba(0,0,0,.18);font-weight:600;font-size:15px}
.ub span{flex:1}
.ub button{background:var(--accent);color:#fff;border-radius:99px;padding:8px 14px;font-size:14px;font-weight:700}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main id="view"></main>
<nav id="tabbar"></nav>
<div id="sheet-root"></div>
<div id="toast"></div>
<div id="update-banner"></div>
<script>
'use strict';
/* ============ Réglages de base ============ */
const APP_VERSION = '1.1';
const STORE_KEY = 'cockpit.v1'; // ne jamais changer : c'est ici que sont tes données
const FR = 'fr-FR';
const SECTIONS = [
  { id: 'morning', title: 'Matin', icon: 'sunrise' },
  { id: 'day', title: 'Journée', icon: 'sun' },
  { id: 'evening', title: 'Soir', icon: 'moon' }
];
const DEFAULT_ACTIONS = [
  ['Routine matin', 'morning', null], ['Skincare', 'morning', null],
  ['Objectif de pas', 'day', 'steps'], ['Hydratation', 'day', 'water'], ['Mouvement / sport', 'day', null],
  ['Skincare', 'evening', null], ['Préparer demain', 'evening', null], ['Routine du soir', 'evening', null]
];
const MEASURES = [
  { id: 'waist', short: 'Taille', label: 'Tour de taille' },
  { id: 'hips', short: 'Hanches', label: 'Tour de hanches' },
  { id: 'thigh', short: 'Cuisse', label: 'Tour de cuisse' },
  { id: 'chest', short: 'Poitrine', label: 'Tour de poitrine' },
  { id: 'arm', short: 'Bras', label: 'Tour de bras' }
];
const SPORTS = ['Marche', 'Course', 'Renfo', 'Pilates', 'Yoga', 'Vélo', 'Natation', 'Danse', 'Autre'];

/* ============ Outils ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp = (v, a = 0, b = 1) => Math.min(Math.max(v, a), b);
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36);
const pad = n => String(n).padStart(2, '0');
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const today = () => keyOf(new Date());
const addDays = (k, n) => { const d = parseKey(k); d.setDate(d.getDate() + n); return keyOf(d); };
const diffDays = (a, b) => Math.round((parseKey(b) - parseKey(a)) / 86400000);
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const fmtLongDate = k => parseKey(k).toLocaleDateString(FR, { weekday: 'long', day: 'numeric', month: 'long' });
const fmtTime = ms => new Date(ms).toLocaleTimeString(FR, { hour: '2-digit', minute: '2-digit' });
const fmtDayTime = ms => new Date(ms).toLocaleDateString(FR, { weekday: 'short' }).replace('.', '') + ' ' + fmtTime(ms);
const fmtNum = n => Math.round(n).toLocaleString(FR);
const fmtL = ml => (ml / 1000).toLocaleString(FR, { maximumFractionDigits: 2 });
const fmtDur = min => { const t = Math.max(0, Math.round(min)); return `${Math.floor(t / 60)} h ${pad(t % 60)}`; };

function parseSleep(s) {

}

function normalize(s) {
  const d = defaultState();
  const out = { ...d, ...s, settings: { ...d.settings, ...(s.settings || {}) } };
  for (const f of ['actions', 'fasts', 'meals', 'measures']) if (!Array.isArray(out[f])) out[f] = f === 'actions' ? d.actions : [];
  if (!out.days || typeof out.days !== 'object') out.days = {};
  return out;
}
function load() {
  try { const raw = localStorage.getItem(STORE_KEY); if (raw) return normalize(JSON.parse(raw)); } catch (e) {}
  return defaultState();
}

const EMPTY_DAY = () => ({ water: [], steps: null, sportMin: null, sportType: '', sleepMin: null, weight: null, energy: 0, mood: 0, bloating: 0, done: {} });

function ensureDay(k) {

  for (const f in e) if (d[f] === undefined) d[f] = e[f];
  return d;
}
const waterTotal = k => getDay(k).water.reduce((a, w) => a + w.ml, 0);
function isDone(k, a) {
  const d = getDay(k);
  if (Object.prototype.hasOwnProperty.call(d.done, a.id)) return !!d.done[a.id];
  if (a.auto === 'steps') return (d.steps || 0) >= S.settings.stepGoal;
  if (a.auto === 'water') return waterTotal(k) >= S.settings.waterGoal;

}

/** Dernière valeur connue pour chaque mesure (jusqu'au jour k inclus si fourni). */
function latestMeasures(k) {
  const out = {}; let date = null;
  for (const m of measuresSorted()) {
    if (k && m.date > k) break;
    let any = false;
    for (const f of MEASURES) if (m[f.id] != null) { out[f.id] = m[f.id]; any = true; }
    if (any) date = m.date;

}
function measureEvolution() {

}

/* ============ Photos (IndexedDB) ============ */
const photoCache = {};
const DB = {
  p: null,
  open() {
    return this.p || (this.p = new Promise((res, rej) => {
      if (!window.indexedDB) return rej(new Error('no idb'));
      const r = indexedDB.open('cockpit', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('photos');
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    }));
  },
  async tx(mode, fn) {
    const db = await this.open();
    return new Promise((res, rej) => {
      const t = db.transaction('photos', mode);
      const req = fn(t.objectStore('photos'));
      t.oncomplete = () => res(req && req.result);
      t.onerror = () => rej(t.error);
    });
  },
  put(id, v) { return this.tx('readwrite', s => s.put(v, id)); },
  del(id) { return this.tx('readwrite', s => s.delete(id)); },
  async loadAll() {
    const db = await this.open();
    return new Promise(res => {
      const out = {};
      const cur = db.transaction('photos').objectStore('photos').openCursor();
      cur.onsuccess = () => { const c = cur.result; if (c) { out[c.key] = c.value; c.continue(); } else res(out); };
      cur.onerror = () => res(out);
    });
  }
};
function compressImage(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, 1080 / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', 0.72));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('image')); };
    img.src = url;
  });
}

    <div class="row between"><div class="label">${ico('sparkles')} Check-in du jour</div>
      ${complete ? `<span style="color:var(--sage)">${ico('checkFill', 20)}</span>` : ''}</div>
    <div style="margin-top:8px">
      ${scaleRow(k, 'energy', 'Énergie', 'bolt', '--accent')}
      ${scaleRow(k, 'mood', 'Humeur', 'smile', '--accent')}
      ${scaleRow(k, 'bloating', 'Ballonnement', 'wind', '--gold')}
    </div>
    <p class="note" style="margin-top:6px;font-size:12px">1 = faible · 5 = fort</p>
  </section>`;
}

function dayPlanCard(k) {
  const total = S.actions.length, done = S.actions.filter(a => isDone(k, a)).length;
  const f = total ? done / total : 0;
  const summary = !total ? 'Ajoute tes premières actions.' : done === total ? 'Tout est fait. Belle journée ✨'
    : done === 0 ? `${total} petites choses pour aujourd'hui` : `${done} sur ${total} réalisées`;
  const sections = SECTIONS.map(s => {
    const items = actionsIn(s.id);
    const rows = items.map(a => {
      if (editMode) return `<button class="arow" data-act="edit-action" data-id="${a.id}"><span class="ck">${ico('circle', 22)}</span><span class="at">${esc(a.title)}</span><span class="edit">${ico('pencil', 16)}</span></button>`;
      const dn = isDone(k, a);
      return `<button class="arow ${dn ? 'done' : ''}" data-act="toggle-action" data-key="${k}" data-id="${a.id}">
        <span class="ck" data-pop="a-${a.id}-${k}">${ico(dn ? 'checkFill' : 'circle', 24)}</span>
        <span class="at">${esc(a.title)}</span>${a.auto ? `<span class="auto">${ico('wand', 15)}</span>` : ''}</button>`;
    }).join('');
    return `<div class="sec"><div class="row between"><div class="label" style="font-size:11px">${ico(s.icon, 15)} ${s.title}</div>
      <button class="icon-btn" data-act="add-action" data-section="${s.id}" aria-label="Ajouter">${ico('plus', 20)}</button></div>
      ${rows || '<p class="empty">Aucune action</p>'}</div>`;
  }).join('');
  return `<section class="card">
    <div class="plan-head">
      <div><div class="label">${ico('list')} Ma journée</div>
        <div class="mid" style="margin-top:6px">Journée ${Math.round(f * 100)} %</div>
        <div class="note" style="margin-top:2px">${summary}</div></div>
      ${ring('plan-' + k, f, 58, 6, 'var(--sage)')}
    </div>
    ${sections}
    <div class="row between" style="margin-top:14px">
      <span class="note" style="margin:0;font-size:12px">${ico('wand', 12)} = coché automatiquement</span>
      <button class="pill ${editMode ? '' : 'soft'}" data-act="edit-mode">${editMode ? 'Terminé' : 'Modifier'}</button></div>
  </section>`;
}

function measureTiles(values) {
  const order = ['waist', 'hips', 'thigh', 'chest', 'arm'].filter(id => values[id] != null);
  return order.map(id => { const f = MEASURES.find(x => x.id === id);
    return `<div class="tile"><span class="v">${fmtCm(values[id])}</span><span class="t">${f.short}</span></div>`; });
}
function measuresCard(k, detail = false) {
  const head = t => `<div class="row between"><div class="label">${ico('ruler')} Mensurations</div>${t}</div>`;
  if (detail) {
    const m = measureOn(k);
    if (!m) return `<section class="card">${head(`<button class="pill" data-act="measure-edit" data-key="${k}">${ico('plus', 13)} Ajouter</button>`)}
      <p class="empty">Aucune mesure ce jour-là.</p></section>`;
    const vals = {}; MEASURES.forEach(f => { if (m[f.id] != null) vals[f.id] = m[f.id]; });
    return `<section class="card">${head(`<button class="pill" data-act="measure-edit" data-key="${k}">${ico('pencil', 13)} Modifier</button>`)}
      <div class="mgrid">${measureTiles(vals).join('')}</div></section>`;
  }
  const { values, date } = latestMeasures();
  const btn = `<button class="pill" data-act="measure-edit" data-key="${k}">${ico('pencil', 13)} Mettre à jour</button>`;
  if (!date) return `<section class="card">${head(btn)}<p class="note">Facultatif : note tes mensurations quand tu le souhaites.</p></section>`;
  const tiles = measureTiles(values);
  const main = tiles.slice(0, 2).join(''), more = tiles.length - 2;
  return `<section class="card">${head(btn)}
    <p class="note" style="margin-top:8px">Dernière mesure : ${esc(shortDate(date))}${date === today() ? " (aujourd'hui)" : ''}</p>
    <div class="tiles">${main}</div>
    <div class="row between" style="margin-top:12px">
      <span class="note" style="margin:0;font-size:13px">${more > 0 ? `+ ${more} autre${more > 1 ? 's' : ''} mesure${more > 1 ? 's' : ''}` : ''}</span>
      <button class="linkish" style="color:var(--accent)" data-act="measure-history">Voir l'évolution ${ico('chevR', 13)}</button></div>
  </section>`;
}
function evolutionRows() {
  return measureEvolution().map(({ f, first, last }) => {
    const same = first.date === last.date;
    return `<div class="cmp"><span class="cmp-l">${f.short}</span>
      <span class="cmp-v">${same ? fmtCm(last[f.id]) : `${first[f.id].toLocaleString(FR, { maximumFractionDigits: 1 })} → ${fmtCm(last[f.id])}`}</span>
      <span class="cmp-d">${same ? '' : fmtDelta(last[f.id] - first[f.id])}</span></div>`;
  }).join('');
}
function evolutionCard() {
  const s = measuresSorted(); if (!s.length) return '';
  return `<section class="card"><div class="row between"><div class="label">${ico('ruler')} Mensurations</div>
      <button class="pill soft" data-act="measure-history">Historique</button></div>
    <p class="note" style="margin-top:8px">${s.length > 1 ? `Du ${esc(shortDate(s[0].date))} au ${esc(shortDate(s[s.length - 1].date))}` : `Mesure du ${esc(shortDate(s[0].date))}`}</p>
    <div class="cmps">${evolutionRows()}</div></section>`;
}

function backupNudge() {
  const now = Date.now(), ref = S.lastBackup || S.createdAt;
  if (now - ref < 4 * 86400000) return '';
  const txt = S.lastBackup ? `Dernière sauvegarde il y a ${Math.floor((now - S.lastBackup) / 86400000)} jours.` : 'Aucune sauvegarde pour le moment.';
  return `<section class="card"><div class="row between gap">
    <div><div class="label">${ico('share')} Sauvegarde</div><p class="note" style="margin-top:6px">${txt}</p></div>
    <button class="pill" data-act="export">Sauvegarder</button></div></section>`;
}

/* ============ Écrans ============ */
function renderToday() {
  const k = today();
  return `<header class="head"><div class="eyebrow">${esc(fmtLongDate(k)).toUpperCase()}</div><h1 class="title">${greeting()}</h1></header>
    ${installBanner()}${heroCard()}${activityCard(k)}${fastingCard()}${waterCard(k)}${checkinCard(k)}${measuresCard(k)}${dayPlanCard(k)}${backupNudge()}`;
}

function statsCard(w) {
  const t = today(), keys = [];
  for (let i = 0; i <= w.total; i++) { const k = addDays(w.start, i); if (diffDays(k, t) < 0) break; keys.push(k); }
  const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
  const steps = avg(keys.map(k => S.days[k]?.steps).filter(v => v != null));
  const sleep = avg(keys.map(k => S.days[k]?.sleepMin).filter(v => v != null));
  const water = avg(keys.map(waterTotal).filter(v => v > 0));
  const energy = avg(keys.map(k => S.days[k]?.energy).filter(v => v > 0));
  const sport = keys.filter(k => (S.days[k]?.sportMin || 0) > 0).length;
  const stat = (v, t) => `<div class="stat"><div class="v">${v}</div><div class="t">${t}</div></div>`;
  return `<section class="card"><div class="label">${ico('sparkles')} Depuis le début</div><div class="stats">
    ${stat(steps != null ? fmtNum(steps) : '—', 'pas en moyenne')}
    ${stat(sleep != null ? fmtDur(sleep) : '—', 'de sommeil en moyenne')}
    ${stat(water != null ? fmtL(water) + ' L' : '—', "d'eau par jour")}
    ${stat(sport, sport > 1 ? 'jours de sport' : 'jour de sport')}
    ${stat(energy != null ? energy.toLocaleString(FR, { maximumFractionDigits: 1 }) + ' / 5' : '—', 'énergie moyenne')}
    ${stat(keys.filter(hasData).length + ' / ' + keys.length, 'jours renseignés')}
  </div></section>`;
}

function renderJourney() {
  const w = W(), t = today();
  const cells = [];
  for (let i = 0; i <= w.total; i++) {
    const k = addDays(w.start, i), left = diffDays(k, w.wedding), future = diffDays(t, k) > 0, wed = left === 0;
    cells.push(`<button class="cell ${future ? 'future' : ''} ${k === t ? 'today' : ''} ${wed ? 'wed' : ''}" data-act="open-day" data-key="${k}" ${future ? 'disabled' : ''}>
      <span class="j">${wed ? 'JOUR J' : 'J-' + left}</span>
      <span class="n">${wed ? icoFill('heart', 20) : parseKey(k).getDate()}</span>
      <span class="p ${hasData(k) ? 'on' : ''}"></span></button>`);
  }
  return `<header class="head"><div class="eyebrow">WEDDING COUNTDOWN</div><h1 class="title">Mes ${w.total} jours</h1></header>
    ${heroCard()}
    <section class="card"><div class="label">${ico('calendar')} Calendrier</div>
      <div class="grid">${cells.join('')}</div>
      <p class="note">Touche un jour pour revoir ou compléter ton suivi. Le point indique un jour renseigné.</p></section>
    ${statsCard(w)}${evolutionCard()}`;
}

function renderDayDetail(k) {
  const w = W(), left = diffDays(k, w.wedding), n = clamp(diffDays(w.start, k) + 1, 1, w.total);
  const start = parseKey(k).getTime(), end = parseKey(addDays(k, 1)).getTime();
  const fasts = S.fasts.filter(f => f.start < end && (f.end || Date.now()) > start).sort((a, b) => a.start - b.start);
  const meals = mealsOn(k);
  return `<button class="back" data-act="back">${ico('chevL', 22)} 19 jours</button>
    <header class="head"><h1 class="title">${esc(cap(fmtLongDate(k)))}</h1>
      <div class="sub-gold">${left > 0 ? `J-${left} · Jour ${n} / ${w.total}` : left === 0 ? 'Jour J 🤍' : ''}</div></header>
    ${activityCard(k)}${waterCard(k)}
    <section class="card"><div class="label">${ico('timer')} Jeûne</div>
      ${fasts.length ? fasts.map(f => `<button class="frow" data-act="fast-edit" data-id="${f.id}">
        <span>${esc(fmtDayTime(f.start))} → ${f.end ? esc(fmtDayTime(f.end)) : 'en cours'}</span><span class="spacer"></span>
        <b style="color:var(--accent)">${fmtDur(((f.end || Date.now()) - f.start) / 60000)}</b>${ico('pencil', 13)}</button>`).join('')
        : '<p class="empty">Aucun jeûne enregistré</p>'}</section>
    <section class="card"><div class="row between"><div class="label">${ico('fork')} Repas</div>
      <button class="pill" data-act="meal-new" data-key="${k}">${ico('plus', 13)} Ajouter</button></div>
      ${meals.length ? `<div class="meals" style="margin-top:8px">${meals.map(mealRow).join('')}</div>` : '<p class="empty">Aucun repas enregistré</p>'}</section>
    ${checkinCard(k)}${measuresCard(k, true)}${dayPlanCard(k)}`;
}

function stepperRow(title, value, field, step) {
  return `<div class="srow"><span>${title}</span><div class="stepper">
    <button data-act="goal" data-field="${field}" data-step="${-step}" aria-label="Moins">−</button><b>${value}</b>
    <button data-act="goal" data-field="${field}" data-step="${step}" aria-label="Plus">+</button></div></div>`;
}
function renderSettings() {
  const s = S.settings;
  const acts = SECTIONS.map(sec => {
    const items = actionsIn(sec.id);
    return `<div class="sec-title">${ico(sec.icon, 14)} ${sec.title}</div>
      ${items.map((a, i) => `<div class="srow">
        <button class="grow" data-act="edit-action" data-id="${a.id}">${esc(a.title)} ${a.auto ? `<span class="muted">${ico('wand', 13)}</span>` : ''}</button>
        <button class="mini" data-act="move" data-id="${a.id}" data-dir="-1" ${i === 0 ? 'disabled style="opacity:.3"' : ''} aria-label="Monter">${ico('up', 16)}</button>
        <button class="mini" data-act="move" data-id="${a.id}" data-dir="1" ${i === items.length - 1 ? 'disabled style="opacity:.3"' : ''} aria-label="Descendre">${ico('down', 16)}</button>
      </div>`).join('')}
      <div class="srow"><button class="grow" style="color:var(--accent);font-weight:600" data-act="add-action" data-section="${sec.id}">${ico('plus', 15)} Ajouter une action</button></div>`;
  }).join('');
  const lb = S.lastBackup ? new Date(S.lastBackup).toLocaleString(FR, { weekday: 'long', day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' }) : 'jamais';
  return `<header class="head"><h1 class="title">Réglages</h1></header>
    <div class="group-title">Mariage</div>
    <section class="card flat">
      <label class="srow"><span>Date du mariage</span><input type="date" data-set="weddingDate" value="${s.weddingDate}"></label>
      <label class="srow"><span>Début du countdown</span><input type="date" data-set="startDate" value="${s.startDate}"></label>
    </section>
    <div class="group-title">Objectifs</div>
    <section class="card flat">
      ${stepperRow('Pas par jour', fmtNum(s.stepGoal), 'stepGoal', 500)}
      ${stepperRow('Eau par jour', fmtL(s.waterGoal) + ' L', 'waterGoal', 250)}
      <label class="srow"><span>Suivre mon poids</span><input class="sw" type="checkbox" data-toggle="showWeight" ${s.showWeight ? 'checked' : ''}></label>
    </section>
    <div class="group-title">Mes actions</div>
    <section class="card flat">${acts}</section>
    <div class="group-title">Sauvegarde</div>
    <section class="card flat"><div class="btn-col">

      <button class="btn-soft" data-act="export">${ico('share', 16)} Exporter une sauvegarde</button>
      <label class="btn-soft" style="--c:var(--muted)">Restaurer une sauvegarde<input type="file" id="import-file" style="display:none"></label>
      <p class="note" style="margin:0">Dernière sauvegarde : ${esc(lb)}</p>
    </div></section>
    <div class="group-title">Application</div>

    </section>
    <p class="note center" style="margin:22px 0 0">Aucun compte, aucun serveur. Tout reste sur ton iPhone.</p>`;
}

/* ============ Rendu ============ */
function renderTabs() {
  const t = route.day ? 'journey' : route.tab;
  const tabs = [['today', 'sun', "Aujourd'hui"], ['journey', 'heart', '19 jours'], ['settings', 'sliders', 'Réglages']];
  $('#tabbar').innerHTML = tabs.map(([id, ic, lbl]) =>
    `<button class="${t === id ? 'on' : ''}" data-act="tab" data-tab="${id}">${ico(ic, 24)}<span>${lbl}</span></button>`).join('');
}
function render() {
  lastRenderDay = today();
  const v = $('#view');
  if (route.day) v.innerHTML = renderDayDetail(route.day);
  else if (route.tab === 'journey') v.innerHTML = renderJourney();
  else if (route.tab === 'settings') v.innerHTML = renderSettings();
  else v.innerHTML = renderToday();
  renderTabs();
  document.querySelectorAll('img[data-photo]').forEach(img => { const p = photoCache[img.dataset.photo]; if (p) img.src = p; });
  if (popId) {
    const el = document.querySelector(`[data-pop="${popId}"]`);
    if (el) el.classList.add('pop');
    popId = null;
  }
  requestAnimationFrame(() => requestAnimationFrame(() => {
    document.querySelectorAll('[data-bar]').forEach(el => {
      const val = +el.dataset.v; el.style.width = (val * 100) + '%'; lastBars[el.dataset.bar] = val;
    });
    document.querySelectorAll('[data-ring]').forEach(el => {
      const val = +el.dataset.v, c = +el.dataset.c; el.style.strokeDashoffset = c * (1 - val); lastBars[el.dataset.ring] = val;
    });
  }));
}
function go(r) { route = r; editMode = false; render(); window.scrollTo(0, 0); }

let toastTimer;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

/* ============ Feuilles (bottom sheets) ============ */
let sheet = null;
function openSheet({ title, body, saveLabel = 'Enregistrer', cancelLabel = 'Annuler', onSave, actions = {}, noSave = false }) {
  const root = $('#sheet-root');
  pendingPhoto = null;
  root.innerHTML = `<div class="scrim" data-sact="close"></div>
    <div class="sheet" role="dialog" aria-label="${esc(title)}"><div class="grabber"></div>
      <div class="sheet-head"><button class="sh-btn" data-sact="close">${esc(cancelLabel)}</button>
        <div class="sh-title">${esc(title)}</div>
        ${noSave ? '<span class="sh-btn"></span>' : `<button class="sh-btn strong" data-sact="save">${esc(saveLabel)}</button>`}</div>
      <div class="sheet-body">${body}</div></div>`;
  sheet = { onSave, actions };
  document.body.classList.add('noscroll');
  requestAnimationFrame(() => requestAnimationFrame(() => root.classList.add('open')));
}
function closeSheet() {
  const root = $('#sheet-root');
  root.classList.remove('open'); sheet = null;
  document.body.classList.remove('noscroll');
  if (document.activeElement) document.activeElement.blur();
  setTimeout(() => { if (!root.classList.contains('open')) root.innerHTML = ''; }, 350);
}
const chip = (forId, val, label, on) => `<button class="chip ${on ? 'on' : ''}" data-sact="chip" data-for="${forId}" data-val="${esc(val)}">${esc(label)}</button>`;
const sheetScale = (id, title, v, color) => `<div class="scale" style="--c:var(${color})"><span class="scale-t">${title}</span>
  <input type="hidden" id="${id}" value="${v || 0}"><span class="dots">${[1, 2, 3, 4, 5].map(i =>
    `<button class="dot ${i <= (v || 0) ? 'on' : ''}" data-sact="sscale" data-for="${id}" data-v="${i}">${i}</button>`).join('')}</span></div>`;
const clearBtn = has => has ? '<button class="btn-danger" data-sact="clear">Effacer la valeur</button>' : '';

function openMetricSheet(k, m) {
  const d = getDay(k), when = k === today() ? "aujourd'hui" : 'le ' + fmtLongDate(k);
  const clearer = fields => ({ clear() { const dd = ensureDay(k); fields.forEach(f => { dd[f] = f === 'sportType' ? '' : null; }); save(); closeSheet(); render(); } });
  if (m === 'steps') {
    openSheet({
      title: 'Pas', body: `<div class="group"><input id="m-steps" class="bigin" type="number" inputmode="numeric" pattern="[0-9]*" placeholder="0" value="${d.steps ?? ''}"></div>
        <p class="hint">Nombre de pas ${esc(when)}. Tu le trouves dans l'app Santé › Pas.</p>
        <div class="chips">${[4000, 6000, 8000, 10000, 12000].map(v => chip('m-steps', v, fmtNum(v), d.steps === v)).join('')}</div>${clearBtn(d.steps != null)}`,
      onSave() {
        const v = parseInt(($('#m-steps').value || '').replace(/\D/g, ''), 10);
        if (isNaN(v)) { toast('Saisis un nombre de pas'); return false; }
        ensureDay(k).steps = v; save(); toast('Pas enregistrés');
      }, actions: clearer(['steps'])
    });
  } else if (m === 'sport') {
    openSheet({
      title: 'Sport', body: `<div class="group"><input id="m-sport" class="bigin" type="number" inputmode="numeric" pattern="[0-9]*" placeholder="0" value="${d.sportMin ?? ''}"></div>
        <p class="hint">Minutes de sport ou d'activité ${esc(when)}.</p>
        <div class="chips">${[10, 15, 20, 30, 45, 60].map(v => chip('m-sport', v, v + ' min', d.sportMin === v)).join('')}</div>
        <div class="group"><label class="field"><span>Type</span><input id="m-sport-type" type="text" placeholder="Facultatif" value="${esc(d.sportType)}" maxlength="30"></label></div>
        <div class="chips">${SPORTS.map(s => chip('m-sport-type', s, s, d.sportType === s)).join('')}</div>${clearBtn(d.sportMin != null)}`,
      onSave() {
        const raw = ($('#m-sport').value || '').replace(/\D/g, '');
        const v = raw === '' ? null : parseInt(raw, 10);
        const type = $('#m-sport-type').value.trim();
        if (v == null && !type) { toast('Indique une durée'); return false; }
        const dd = ensureDay(k); dd.sportMin = v ?? 0; dd.sportType = type; save(); toast('Sport enregistré');
      }, actions: clearer(['sportMin', 'sportType'])
    });
  } else if (m === 'sleep') {
    openSheet({
      title: 'Sommeil', body: `<div class="group"><input id="m-sleep" class="bigin" type="text" inputmode="text" placeholder="7h30" value="${sleepInput(d.sleepMin)}"></div>
        <p class="hint">Durée de la nuit précédente (${esc(when)}). Exemples : 7h30, 7,5 ou 8.</p>
        <div class="chips">${['6h', '6h30', '7h', '7h30', '8h', '8h30', '9h'].map(v => chip('m-sleep', v, v.replace('h', ' h '), sleepInput(d.sleepMin) === v)).join('')}</div>${clearBtn(d.sleepMin != null)}`,
      onSave() {
        const v = parseSleep($('#m-sleep').value);
        if (isNaN(v) || v <= 0 || v > 24 * 60) { toast('Durée non reconnue (ex. 7h30)'); return false; }
        ensureDay(k).sleepMin = v; save(); toast('Sommeil enregistré');
      }, actions: clearer(['sleepMin'])
    });
  } else if (m === 'weight') {
    openSheet({
      title: 'Poids', body: `<div class="group"><input id="m-weight" class="bigin" type="text" inputmode="decimal" placeholder="0,0" value="${d.weight != null ? String(d.weight).replace('.', ',') : ''}"></div>
        <p class="hint">En kilos, ${esc(when)}. Donnée facultative, que tu peux masquer dans Réglages.</p>${clearBtn(d.weight != null)}`,
      onSave() {
        const v = parseFloat(($('#m-weight').value || '').replace(',', '.'));
        if (isNaN(v) || v <= 0 || v > 400) { toast('Poids non reconnu'); return false; }
        ensureDay(k).weight = Math.round(v * 10) / 10; save(); toast('Poids enregistré');
      }, actions: clearer(['weight'])
    });
  }
}

function openMealSheet({ meal = null, dayKey = today(), fromFast = false }) {
  const isToday = dayKey === today();
  const time = meal ? meal.time : fromFast && S.mealStartedAt ? S.mealStartedAt : isToday ? Date.now() : parseKey(dayKey).setHours(13, 0, 0, 0);
  const end = meal ? meal.end : isToday ? Date.now() : time + 30 * 60000;
  const showToggle = !meal && isToday && !currentFast();
  openSheet({
    title: meal ? 'Modifier le repas' : 'Repas du jour', saveLabel: meal ? 'Enregistrer' : 'Terminé',
    body: `<div class="group"><label class="field"><span>Heure du repas</span><input id="meal-time" type="datetime-local" value="${toLocalInput(time)}"></label></div>
      <div class="group">
        <label class="field col"><textarea id="meal-text" placeholder="Qu'as-tu mangé ?" maxlength="300">${esc(meal ? meal.text : '')}</textarea></label>
        <label class="photo-pick">${ico('camera', 20)} ${meal && meal.hasPhoto ? 'Changer la photo' : 'Ajouter une photo'}<input type="file" id="meal-photo" accept="image/*" style="display:none"></label>
        <div class="photo-prev" id="meal-photo-prev">${meal && meal.hasPhoto && photoCache[meal.id] ? `<img src="${photoCache[meal.id]}" alt="">` : ''}</div>
      </div>
      <div class="group" style="padding:6px 14px">
        ${sheetScale('meal-hunger', 'Faim avant', meal ? meal.hunger : 0, '--accent')}
        ${sheetScale('meal-full', 'Satiété après', meal ? meal.fullness : 0, '--sage')}
      </div>
      ${meal ? '' : `<div class="group"><label class="field"><span>Repas terminé à</span><input id="meal-end" type="datetime-local" value="${toLocalInput(end)}"></label>
        ${showToggle ? `<label class="field"><span>Démarrer le nouveau jeûne</span><input id="meal-newfast" class="sw" type="checkbox" ${fromFast ? 'checked' : ''}></label>` : ''}</div>
        ${showToggle ? '<p class="hint">Le nouveau jeûne démarre à l’heure de fin du repas.</p>' : ''}`}
      ${meal ? '<button class="btn-danger" data-sact="del">Supprimer ce repas</button>' : ''}`,
    async onSave() {
      const t = fromLocalInput($('#meal-time').value);
      if (!t) { toast("Indique l'heure du repas"); return false; }
      const text = $('#meal-text').value.trim(), hunger = +$('#meal-hunger').value || 0, fullness = +$('#meal-full').value || 0;
      const photo = pendingPhoto;
      const storePhoto = async id => {
        if (!photo) return false;
        photoCache[id] = photo;
        try { await DB.put(id, photo); } catch (e) { toast('Photo non enregistrée'); }
        return true;
      };
      if (meal) {
        Object.assign(meal, { time: t, text, hunger, fullness });
        if (await storePhoto(meal.id)) meal.hasPhoto = true;
        save(); toast('Repas modifié'); return;
      }
      const e = Math.max(fromLocalInput($('#meal-end').value) || t, t);
      const m = { id: uid(), time: t, end: e, text, hunger, fullness, hasPhoto: false };
      if (await storePhoto(m.id)) m.hasPhoto = true;
      S.meals.push(m);
      if (S.mealStartedAt) { const last = lastEndedFast(); if (last) last.end = Math.max(t, last.start); }
      const startNew = !!($('#meal-newfast') && $('#meal-newfast').checked);
      if (startNew && !currentFast()) S.fasts.push({ id: uid(), start: e, end: null });
      S.mealStartedAt = null; save();
      toast(startNew ? 'Repas enregistré · nouveau jeûne lancé' : 'Repas enregistré');
    },
    actions: meal ? {
      del() {
        if (!confirm('Supprimer ce repas ?')) return;
        S.meals = S.meals.filter(x => x !== meal); delete photoCache[meal.id];
        DB.del(meal.id).catch(() => {});
        save(); closeSheet(); render();
      }
    } : {}
  });
}

function openMeasureSheet(k) {
  const existing = measureOn(k);
  const pre = existing ? existing : latestMeasures(k).values;
  const when = k === today() ? "aujourd'hui" : 'le ' + fmtLongDate(k);
  openSheet({
    title: 'Mensurations',
    body: `<div class="group">${MEASURES.map(f => `<label class="field"><span>${f.label}</span>
        <input id="ms-${f.id}" type="text" inputmode="decimal" placeholder="—" value="${pre[f.id] != null ? String(pre[f.id]).replace('.', ',') : ''}">
        <span class="unit">cm</span></label>`).join('')}</div>
      <p class="hint">Mesures ${esc(when)}. Tous les champs sont facultatifs${existing ? '' : ' ; les dernières valeurs connues sont préremplies, modifie seulement celles qui ont changé'}.</p>
      ${existing ? '<button class="btn-danger" data-sact="del">Supprimer les mesures de ce jour</button>' : ''}`,
    onSave() {
      const vals = {}; let any = false;
      for (const f of MEASURES) {
        const raw = ($(`#ms-${f.id}`).value || '').trim().replace(',', '.');
        if (raw === '') { vals[f.id] = null; continue; }
        const v = parseFloat(raw);
        if (isNaN(v) || v <= 0 || v > 300) { toast(`${f.short} : valeur non reconnue`); return false; }
        vals[f.id] = Math.round(v * 10) / 10; any = true;
      }
      if (!any) { toast('Saisis au moins une mesure'); return false; }
      if (existing) Object.assign(existing, vals, { updatedAt: Date.now() });
      else S.measures.push({ id: uid(), date: k, ...vals, updatedAt: Date.now() });
      save(); toast('Mensurations enregistrées');
    },
    actions: existing ? {
      del() {
        if (!confirm('Supprimer les mesures de ce jour ?')) return;
        S.measures = S.measures.filter(x => x !== existing); save(); closeSheet(); render();
      }
    } : {}
  });
}
function openMeasureHistory() {
  const list = measuresSorted().reverse();
  openSheet({
    title: 'Évolution', noSave: true, cancelLabel: 'Fermer',
    body: list.length ? `<p class="hint" style="margin-bottom:8px">Première mesure → dernière mesure</p>
      <div class="group" style="padding:6px 14px"><div class="cmps" style="margin:0">${evolutionRows()}</div></div>
      <p class="hint" style="margin-bottom:8px">Historique</p>
      <div class="group">${list.map(m => `<button class="field" style="width:100%" data-sact="edit" data-key="${m.date}">
        <span>${esc(cap(shortDate(m.date)))}</span>
        <span class="muted" style="font-size:14px;text-align:right">${MEASURES.filter(f => m[f.id] != null).map(f => `${f.short} ${m[f.id].toLocaleString(FR, { maximumFractionDigits: 1 })}`).join(' · ')}</span></button>`).join('')}</div>
      <p class="hint">Touche une date pour la modifier.</p>`
      : '<p class="hint">Aucune mesure pour le moment.</p>',
    actions: { edit(el) { openMeasureSheet(el.dataset.key); } }
  });
}

function openFastSheet(f) {
  if (!f) return;
  openSheet({
    title: 'Modifier le jeûne',
    body: `<div class="group"><label class="field"><span>Début</span><input id="f-start" type="datetime-local" value="${toLocalInput(f.start)}"></label>
      ${f.end ? `<label class="field"><span>Fin</span><input id="f-end" type="datetime-local" value="${toLocalInput(f.end)}"></label>` : ''}</div>
      <p class="hint">Durée actuelle : ${fmtDur(((f.end || Date.now()) - f.start) / 60000)}</p>
      <button class="btn-danger" data-sact="del">Supprimer ce jeûne</button>`,
    onSave() {
      const s = fromLocalInput($('#f-start').value);
      if (!s) { toast('Heure de début invalide'); return false; }
      if (s > Date.now()) { toast('Le début ne peut pas être dans le futur'); return false; }
      let e = null;
      if (f.end) { e = fromLocalInput($('#f-end').value); if (!e || e < s) { toast('La fin doit suivre le début'); return false; } }
      f.start = s; if (f.end) f.end = e; save(); toast('Jeûne modifié');
    },
    actions: {
      del() {
        if (!confirm('Supprimer ce jeûne ?')) return;
        S.fasts = S.fasts.filter(x => x !== f); save(); closeSheet(); render();
      }
    }
  });
}

function openUnwellSheet() {
  openSheet({
    title: 'Écoute ton corps', noSave: true, cancelLabel: 'Fermer',
    body: `<div class="group" style="padding:18px"><p class="mid" style="margin:0 0 10px;font-size:21px">Prends soin de toi 🤍</p>
      <p class="muted" style="margin:0;line-height:1.5">Fatigue inhabituelle, vertiges ou faiblesse sont des signaux à écouter : il est plus prudent de manger et de boire maintenant. Si cela persiste ou revient, parles-en à un médecin.</p></div>
      <button class="btn-primary" data-sact="endnow">Terminer le jeûne maintenant</button>`,
    actions: { endnow() { closeSheet(); endFast(); } }
  });
}

function openActionSheet(a, section) {
  const sec = a ? a.section : (section || 'day');
  openSheet({
    title: a ? "Modifier l'action" : 'Nouvelle action',
    body: `<div class="group"><label class="field col"><input id="a-title" type="text" placeholder="Nom de l'action" value="${esc(a ? a.title : '')}" maxlength="60"></label></div>
      <p class="hint" style="margin-bottom:8px">Moment de la journée</p>
      <input type="hidden" id="a-sec" value="${sec}">
      <div class="seg">${SECTIONS.map(s => `<button class="${s.id === sec ? 'on' : ''}" data-sact="seg" data-for="a-sec" data-val="${s.id}">${s.title}</button>`).join('')}</div>
      ${a ? '<button class="btn-danger" data-sact="del">Supprimer l’action</button>' : ''}`,
    onSave() {
      const title = $('#a-title').value.trim();
      if (!title) { toast("Donne un nom à l'action"); return false; }
      const s = $('#a-sec').value;
      if (a) { if (a.section !== s) a.order = Date.now(); a.title = title; a.section = s; }
      else S.actions.push({ id: uid(), title, section: s, auto: null, order: Date.now() });
      save(); toast(a ? 'Action modifiée' : 'Action ajoutée');
    },
    actions: a ? {
      del() {
        if (!confirm(`Supprimer « ${a.title} » ?`)) return;
        S.actions = S.actions.filter(x => x !== a); save(); closeSheet(); render();
      }
    } : {}
  });
}

/* ============ Actions métier ============ */
function endFast() {
  const cur = currentFast(); if (!cur) return;
  const now = Date.now(); cur.end = now; S.mealStartedAt = now;
  save(); render(); toast('Jeûne terminé · bon appétit');
}
function moveAction(id, dir) {
  const a = S.actions.find(x => x.id === id); if (!a) return;
  const list = actionsIn(a.section), i = list.indexOf(a), j = i + dir;
  if (j < 0 || j >= list.length) return;
  [list[i], list[j]] = [list[j], list[i]];
  list.forEach((x, n) => { x.order = n; });
  save(); render();
}

async function exportData() {
  const json = JSON.stringify({ app: 'cockpit', version: 1, exportedAt: new Date().toISOString(), state: S, photos: photoCache });
  const name = `cockpit-sauvegarde-${today()}.json`;
  const file = new File([json], name, { type: 'application/json' });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: 'Sauvegarde Cockpit' });
    } else {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(file); a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
    }
    S.lastBackup = Date.now(); save(); render(); toast('Sauvegarde exportée');
  } catch (e) {
    toast(e && e.name === 'AbortError' ? 'Sauvegarde annulée' : 'Export impossible');
  }
}
async function importFile(file) {
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (data.app !== 'cockpit' || !data.state) throw new Error('format');
    if (!confirm('Remplacer les données actuelles par cette sauvegarde ?')) return;
    S = normalize(data.state);
    for (const [id, p] of Object.entries(data.photos || {})) {
      photoCache[id] = p;
      try { await DB.put(id, p); } catch (e) {}
    }
    save(); go({ tab: 'today', day: null }); toast('Sauvegarde restaurée');
  } catch (e) { toast('Fichier de sauvegarde invalide'); }
}

/* ============ Événements ============ */
async function handleSheetAct(el) {
  const n = el.dataset.sact;
  if (n === 'close') return closeSheet();
  if (n === 'save') {
    if (!sheet || !sheet.onSave || el.disabled) return;
    el.disabled = true;
    const ok = await sheet.onSave();
    el.disabled = false;
    if (ok !== false) { closeSheet(); render(); }
    return;
  }
  if (n === 'chip' || n === 'seg') {
    const inp = document.getElementById(el.dataset.for); if (!inp) return;
    inp.value = el.dataset.val;
    document.querySelectorAll(`[data-sact="${n}"][data-for="${el.dataset.for}"]`).forEach(c => c.classList.toggle('on', c === el));
    return;
  }
  if (n === 'sscale') {
    const inp = document.getElementById(el.dataset.for); if (!inp) return;
    const v = +el.dataset.v, nv = +inp.value === v ? 0 : v; inp.value = nv;
    document.querySelectorAll(`[data-sact="sscale"][data-for="${el.dataset.for}"]`).forEach(c => c.classList.toggle('on', +c.dataset.v <= nv));
    return;
  }
  if (sheet && sheet.actions && sheet.actions[n]) await sheet.actions[n](el);
}

document.addEventListener('click', async e => {
  const sa = e.target.closest('[data-sact]');
  if (sa) { e.preventDefault(); await handleSheetAct(sa); return; }
  const t = e.target.closest('[data-act]');
  if (!t || t.disabled) return;
  const a = t.dataset.act, k = t.dataset.key;
  switch (a) {
    case 'tab': go({ tab: t.dataset.tab, day: null }); break;
    case 'open-day': go({ tab: 'journey', day: k }); break;
    case 'back': go({ tab: 'journey', day: null }); break;
    case 'water-add': {
      const d = ensureDay(k);
      d.water.push({ t: k === today() ? Date.now() : parseKey(k).setHours(12, 0, 0, 0), ml: +t.dataset.ml });
      popId = t.dataset.pop; save(); render(); toast(`+ ${t.dataset.ml} ml`); break;
    }
    case 'water-undo': {
      const d = ensureDay(k); d.water.sort((x, y) => x.t - y.t).pop();
      save(); render(); toast('Dernière saisie annulée'); break;
    }
    case 'scale': {
      const d = ensureDay(k), f = t.dataset.field, v = +t.dataset.v;
      d[f] = d[f] === v ? 0 : v; popId = t.dataset.pop; save(); render(); break;
    }
    case 'toggle-action': {
      const act = S.actions.find(x => x.id === t.dataset.id); if (!act) break;
      const d = ensureDay(k); d.done[act.id] = !isDone(k, act);
      popId = `a-${act.id}-${k}`; save(); render(); break;
    }
    case 'edit-mode': editMode = !editMode; render(); break;
    case 'add-action': openActionSheet(null, t.dataset.section); break;
    case 'edit-action': openActionSheet(S.actions.find(x => x.id === t.dataset.id)); break;
    case 'metric': openMetricSheet(k, t.dataset.metric); break;
    case 'fast-start':
      if (!currentFast()) { S.fasts.push({ id: uid(), start: Date.now(), end: null }); S.mealStartedAt = null; save(); render(); toast('Jeûne commencé'); }
      break;
    case 'fast-end': endFast(); break;
    case 'fast-edit': openFastSheet(S.fasts.find(f => f.id === t.dataset.id)); break;
    case 'unwell': openUnwellSheet(); break;
    case 'measure-edit': openMeasureSheet(k || today()); break;
    case 'measure-history': openMeasureHistory(); break;
    case 'apply-update': applyUpdate(); break;
    case 'check-update': checkForUpdate(true); break;
    case 'meal-new': openMealSheet(k ? { dayKey: k } : { dayKey: today(), fromFast: !!S.mealStartedAt }); break;
    case 'meal-edit': { const m = S.meals.find(x => x.id === t.dataset.id); if (m) openMealSheet({ meal: m }); break; }
    case 'goal': {
      const f = t.dataset.field, lim = { stepGoal: [1000, 30000], waterGoal: [500, 5000] }[f];
      S.settings[f] = clamp(S.settings[f] + (+t.dataset.step), lim[0], lim[1]); save(); render(); break;
    }
    case 'move': moveAction(t.dataset.id, +t.dataset.dir); break;
    case 'export': exportData(); break;
  }
});

document.addEventListener('change', async e => {
  const t = e.target;
  if (t.dataset.set) {
    if (!t.value) return;
    S.settings[t.dataset.set] = t.value; save(); render(); toast('Enregistré');
  } else if (t.dataset.toggle) {
    S.settings[t.dataset.toggle] = t.checked; save(); render();
  } else if (t.id === 'import-file') {
    await importFile(t.files[0]); t.value = '';
  } else if (t.id === 'meal-photo' && t.files[0]) {
    try {
      pendingPhoto = await compressImage(t.files[0]);
      const prev = $('#meal-photo-prev'); if (prev) prev.innerHTML = `<img src="${pendingPhoto}" alt="">`;
    } catch (err) { toast('Photo illisible'); }
  }
});

document.addEventListener('visibilitychange', () => { if (!document.hidden && !sheet) render(); });

setInterval(() => {
  document.querySelectorAll('[data-timer]').forEach(el => { el.textContent = fastMain(+el.dataset.timer); });
  document.querySelectorAll('[data-timer-s]').forEach(el => { el.textContent = fastSec(+el.dataset.timerS); });
  if (today() !== lastRenderDay && !sheet) render();
}, 1000);

/* ============ Démarrage ============ */
render();
DB.loadAll().then(all => { Object.assign(photoCache, all); if (Object.keys(all).length && !sheet) render(); }).catch(() => {});
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
/* ============ Mises à jour de l'app ============ */
let swReg = null;
function showUpdateBanner() {
  const b = $('#update-banner'); if (!b) return;
  b.innerHTML = `<div class="ub">${ico('sparkles', 18)}<span>Nouvelle version disponible</span>
    <button data-act="apply-update">Mettre à jour</button></div>`;
  b.classList.add('show');
}
function watchWorker(w) {
  if (!w) return;
  w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) showUpdateBanner(); });
}
async function checkForUpdate(manual) {
  if (!swReg) { if (manual) toast('Mise à jour indisponible ici'); return; }
  try {
    await swReg.update();
    if (manual) setTimeout(() => { if (!swReg.waiting && !swReg.installing) toast(`Tu as la dernière version (${APP_VERSION})`); }, 1500);
  } catch (e) { if (manual) toast('Pas de connexion'); }
}
function applyUpdate() {
  save(); // tes données sont enregistrées avant le rechargement
  if (swReg && swReg.waiting) swReg.waiting.postMessage({ type: 'SKIP_WAITING' });
  else location.reload();
}
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  const hadController = !!navigator.serviceWorker.controller;
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadController || reloading) return;
    reloading = true; location.reload();
  });
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').then(reg => {
      swReg = reg;
      if (reg.waiting && navigator.serviceWorker.controller) showUpdateBanner();
      watchWorker(reg.installing);
      reg.addEventListener('updatefound', () => watchWorker(reg.installing));
    }).catch(() => {});
  });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) checkForUpdate(false); });
}
if (!localStorage.getItem(STORE_KEY)) save();
</script>
</body>
</html>
